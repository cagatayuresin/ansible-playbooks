---
- name: Sistemdeki Büyük Dosyaları Tespit Etme
  hosts: all
  gather_facts: false

  vars:
    min_size: "1G"       # Aranacak minimum dosya boyutu
    max_age_days: "30"   # Son X günde değiştirilmiş dosyalar

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Büyük dosyaları bul
      become: true
      shell: "find / -type f -size +{{ min_size }} -mtime -{{ max_age_days }} -exec ls -lh {} + 2>/dev/null || true"
      register: large_files
      changed_when: false

    - name: Sonuçları Raporla
      debug:
        msg:
          - |
            ################################################################################
            # HOST: {{ inventory_hostname }}
            # Kriter: {{ min_size }}'dan büyük, son {{ max_age_days }} günde değişenler
            ################################################################################
          - "{{ large_files.stdout_lines | default(['Büyük dosya bulunamadı.']) }}"
