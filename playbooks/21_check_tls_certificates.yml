---
- name: TLS / Ingress / Kubernetes Sertifika Kontrolü
  hosts: master:singlenode
  gather_facts: true
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Sertifika / Ingress TLS raporunu üret
      become: true
      script: k8s_tls_certificates_check.py
      args:
        executable: python3
      register: tls_report
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: inventory_hostname == first_control_plane

    - name: TLS / Ingress / K8s sertifika raporu
      debug:
        msg:
          - |
            ################################################################################
            # HOST: {{ inventory_hostname }}
            # hostname: {{ ansible_facts['hostname'] | default('n/a') }}
            ################################################################################
          - "{{ tls_report.stdout | default(tls_report.stderr | default('Rapor üretilemedi')) }}"
      when: inventory_hostname == first_control_plane
