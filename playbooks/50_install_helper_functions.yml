---
- name: Install / Remove Shell Helper Functions
  hosts: all
  gather_facts: false

  vars:
    shell_aliases_state: present
    shell_aliases_pack: helpers
    shell_aliases_src: files/shell-aliases/helpers.sh
    shell_aliases_target_user: "{{ ansible_user }}"

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Apply helper function pack
      import_tasks: tasks/shell_aliases.yml
