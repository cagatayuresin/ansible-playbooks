---
- name: Server time and timezone report
  hosts: all
  gather_facts: true

  vars:
    time_service_patterns:
      - chrony
      - systemd-timesyncd
      - ntpd
      - ^ntp

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Discover services on the host
      service_facts:

    - name: Filter time sync services
      set_fact:
        time_services: "{{ ansible_facts.services.keys() | select('search', time_service_patterns | join('|')) | list }}"

    - name: "Time sync service status (When: matching service exists)"
      debug:
        msg: "{{ item }} -> state: {{ ansible_facts.services[item].get('state', 'unknown') }}, enabled at boot: {{ ansible_facts.services[item].get('status', 'unknown') }}"
      loop: "{{ time_services }}"
      loop_control:
        label: "{{ item }}"
      when: time_services | length > 0

    - name: "No time sync service warning (When: no matching service exists)"
      debug:
        msg: "No known time sync service (chrony/systemd-timesyncd/ntpd) found on this host."
      when: time_services | length == 0

    - name: Collect server time and timezone
      command: timedatectl
      register: server_time
      changed_when: false

    - name: Time and timezone report
      debug:
        msg:
          - |
            ################################################################################
            # HOST: {{ inventory_hostname }}
            # hostname: {{ ansible_facts['hostname'] | default('n/a') }}
            ################################################################################
          - "{{ server_time.stdout }}"
