---
- name: Backup Kubernetes etcd Database
  hosts: master:singlenode
  gather_facts: true

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"
    # Snapshots older than this retention window are deleted after a successful backup.
    etcd_backup_retention_days: 30

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Validate etcd backup retention
      assert:
        that:
          - (etcd_backup_retention_days | string) is match('^[1-9][0-9]*$')
        fail_msg: "etcd_backup_retention_days must be a positive integer."
      when: inventory_hostname == first_control_plane

    - name: Run etcd backup script
      become: true
      script: files/k8s_etcd_backup.sh
      environment:
        ETCD_BACKUP_RETENTION_DAYS: "{{ etcd_backup_retention_days | string }}"
      register: etcd_backup_result
      changed_when: true
      when: inventory_hostname == first_control_plane

    - name: Backup result
      debug:
        msg:
          - |
            ################################################################################
            # HOST: {{ inventory_hostname }}
            ################################################################################
          - "{{ etcd_backup_result.stdout_lines | default(['Backup runs only on the first master node.']) }}"
