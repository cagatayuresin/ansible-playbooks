---
- name: Metrics-server Kurulum Kontrolü
  hosts: master:singlenode
  gather_facts: true
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Metrics-server durumunu kontrol et
      import_tasks: tasks/metrics_server_check.yml
      when: inventory_hostname == first_control_plane

    - name: Metrics-server durum raporu
      debug:
        msg:
          - |
            ################################################################################
            # HOST: {{ inventory_hostname }}
            # hostname: {{ ansible_facts['hostname'] | default('n/a') }}
            ################################################################################
          - |
            kubectl erişimi: {{ 'OK' if kubectl_check.rc == 0 else 'YOK' }}
          - |
            Deployment (kube-system/metrics-server):
            {{ metrics_server_deploy.stdout | default(metrics_server_deploy.stderr | default('bulunamadı')) | trim
               if (kubectl_check.rc == 0 and metrics_server_deploy is defined) else 'atlandı / bulunamadı' }}
          - |
            APIService v1beta1.metrics.k8s.io Available: {{ metrics_server_api.stdout | default('False') | trim
               if (kubectl_check.rc == 0 and metrics_server_api is defined) else 'bilinmiyor' }}
          - |
            Pod'lar:
            {{ metrics_server_pods.stdout | default(metrics_server_pods.stderr | default('yok')) | trim
               if (kubectl_check.rc == 0 and metrics_server_pods is defined) else 'atlandı' }}
          - |
            Sonuç: metrics-server {{ 'HAZIR' if (metrics_server_ready | default(false) | bool) else 'HAZIR DEĞİL' }}
            İstatistik için: playbooks/15_get_metrics_server_stats.yml
            Kurulu değilse kur+istatistik: playbooks/16_ensure_metrics_server.yml
      when: inventory_hostname == first_control_plane
