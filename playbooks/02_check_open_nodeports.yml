---
- name: Check Open NodePorts and Generate Browser Links
  hosts: master, singlenode
  gather_facts: false
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Check kubeconfig / kubectl access
      command: kubectl cluster-info
      register: kubectl_check
      ignore_errors: true
      changed_when: false

    - name: Warn that kubectl is unreachable
      debug:
        msg: "kubectl access failed (KUBECONFIG missing/wrong or cluster unreachable)."
      when: kubectl_check.rc != 0

    - name: Find all NodePort services and their ports
      shell: |
        kubectl get svc -A -o jsonpath='{range .items[?(@.spec.type=="NodePort")]}{.metadata.namespace}/{.metadata.name}: {range .spec.ports[*]}{.nodePort}{" "}{end}{"\n"}{end}'
      register: nodeport_services
      changed_when: false
      when: kubectl_check.rc == 0

    - name: "Generate browser accessible links (When: open NodePort exists)"
      debug:
        msg: |
          The following services are exposed as NodePort. Use these links to open them in a browser:
          {% for line in nodeport_services.stdout_lines %}
          - {{ line.split(':')[0] }} -> http://{{ inventory_hostname }}:{{ line.split(':')[1] | trim | split(' ') | first }}
          {% endfor %}
      when:
        - kubectl_check.rc == 0
        - nodeport_services is defined
        - nodeport_services.stdout_lines | length > 0

    - name: "No NodePort found message (When: no NodePort exists)"
      debug:
        msg: "No open NodePort found on this system."
      when:
        - kubectl_check.rc == 0
        - nodeport_services is defined
        - nodeport_services.stdout_lines | length == 0
