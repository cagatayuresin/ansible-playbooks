---
- name: Check Kubernetes Pod Health
  hosts: master, singlenode
  gather_facts: false
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Check kubeconfig / kubectl access
      command: kubectl cluster-info
      register: kubectl_check
      ignore_errors: true
      changed_when: false

    - name: Warn that kubectl is unreachable
      debug:
        msg: "kubectl access failed (KUBECONFIG missing/wrong or cluster unreachable)."
      when: kubectl_check.rc != 0

    - name: Get all pods in all namespaces with wide output
      command: kubectl get pods -A -o wide
      register: pod_status
      changed_when: false
      when: kubectl_check.rc == 0

    - name: Display pod health status
      debug:
        msg: "{{ pod_status.stdout_lines }}"
      when:
        - kubectl_check.rc == 0
        - pod_status is defined
