---
- name: Kubernetes stack version report
  hosts: all
  gather_facts: false
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Detect Kubernetes versions
      import_tasks: tasks/k8s_versions.yml

    - name: Version report
      debug:
        msg:
          - "kubectl: {{ kubectl_version.stdout | default('kubectl not available or version not retrieved') }}"
          - "kubeadm: {{ kubeadm_version.stdout | default('not found') }}"
          - "kubelet: {{ kubelet_version.stdout | default('not found') }}"
          - "containerd: {{ containerd_version.stdout | default('not found') }}"
          - "runc: {{ runc_version.stdout | default('not found') }}"
          - "etcd image: {{ etcd_version.stdout | default('not found or kubectl not available') }}"
