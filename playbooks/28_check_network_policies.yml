---
- name: NetworkPolicy Inventory
  hosts: master:singlenode
  gather_facts: true
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"
    # Empty = all namespaces; set to limit to one namespace
    netpol_namespace: ""

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Generate NetworkPolicy report
      script: >-
        k8s_network_policies_check.py
        --namespace {{ netpol_namespace | default('') | quote }}
      args:
        executable: python3
      register: netpol_report
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: inventory_hostname == first_control_plane

    - name: NetworkPolicy inventory report
      debug:
        msg: >-
          {{
            ['#' * 80,
             '# HOST: ' ~ inventory_hostname,
             '# hostname: ' ~ (ansible_facts['hostname'] | default('n/a')),
             '# namespace: ' ~ (netpol_namespace if (netpol_namespace | default('') | length) > 0 else 'ALL'),
             '#' * 80]
            + (netpol_report.stdout_lines
               | default(netpol_report.stderr_lines | default(['Failed to generate report'])))
          }}
      when: inventory_hostname == first_control_plane
