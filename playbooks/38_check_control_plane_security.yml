---
- name: Kubernetes Control-Plane Security Configuration
  hosts: master:singlenode
  gather_facts: true

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"
    control_plane_security_fail_on_critical: false

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Run control-plane security analysis
      become: true
      script: files/control_plane_security_check.py
      register: control_plane_security_result
      changed_when: false
      failed_when: false
      when: inventory_hostname == first_control_plane

    - name: Control-plane security report
      debug:
        msg: "{{ control_plane_security_result.stdout_lines | default(control_plane_security_result.stderr_lines | default(['Failed to generate report'])) }}"
      when: inventory_hostname == first_control_plane

    - name: Fail on critical control-plane security findings
      fail:
        msg: "Critical security findings in the control-plane configuration."
      when:
        - inventory_hostname == first_control_plane
        - control_plane_security_fail_on_critical | bool
        - control_plane_security_result.rc | default(1) != 0
