---
- name: Server time and timezone pre-report
  import_playbook: 08_check_server_time.yml

- name: Set Server Timezone to Europe/Istanbul
  hosts: all
  gather_facts: false

  tasks:
    - name: Set timezone to Europe/Istanbul
      become: true
      community.general.timezone:
        name: Europe/Istanbul
      register: timezone_set

    - name: Timezone change result
      debug:
        msg:
          - |
            ################################################################################
            # HOST: {{ inventory_hostname }}
            # hostname: {{ ansible_facts['hostname'] | default('n/a') }}
            ################################################################################
          - "Timezone {{ 'changed to Europe/Istanbul' if timezone_set.changed else 'already Europe/Istanbul, no change' }}"

    - name: "Start and enable time sync services (When: play 08 found a time service)"
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: "{{ time_services | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: time_service_enable
      when: time_services is defined and time_services | length > 0

    - name: "No time service found, skip enable (When: play 08 found no time service)"
      debug:
        msg: "No known time sync service (chrony/systemd-timesyncd/ntpd) was found while 08_check_server_time.yml ran, so the enable step was skipped."
      when: time_services is not defined or time_services | length == 0

    - name: Time sync service enable report
      debug:
        msg: "{{ item.item }} -> {{ 'started/enabled' if item.changed else 'already active and enabled' }}"
      loop: "{{ time_service_enable.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify current time and timezone
      command: timedatectl
      register: server_time_after
      changed_when: false

    - name: Verification report
      debug:
        msg:
          - |
            ################################################################################
            # HOST: {{ inventory_hostname }}
            # hostname: {{ ansible_facts['hostname'] | default('n/a') }}
            ################################################################################
          - "{{ server_time_after.stdout }}"
