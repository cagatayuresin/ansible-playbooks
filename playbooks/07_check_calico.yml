---
- name: Calico version check and update
  hosts: master:singlenode
  gather_facts: false
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: "Check kubeconfig / kubectl access (When: first control-plane node)"
      command: kubectl cluster-info
      register: kubectl_check
      ignore_errors: true
      changed_when: false
      when: inventory_hostname == first_control_plane

    - name: "Get current Calico image/version (When: kubectl access is available)"
      command: kubectl get daemonset calico-node -n kube-system -o jsonpath={.spec.template.spec.containers[0].image}
      register: calico_before
      changed_when: false
      ignore_errors: true
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0

    - name: "Apply Calico manifest (When: calico_manifest_url is set)"
      command: kubectl apply -f {{ calico_manifest_url }}
      register: calico_apply
      changed_when: true
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - calico_manifest_url is defined
        - calico_manifest_url != ""

    - name: "Warn that calico_manifest_url is missing (When: calico_manifest_url is NOT set)"
      debug:
        msg: >-
          calico_manifest_url is not set, no update applied. Example:
          --extra-vars "calico_manifest_url=<official manifest URL>"
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - calico_manifest_url is not defined or calico_manifest_url == ""

    - name: "Wait for Calico DaemonSet rollout (When: manifest was applied)"
      command: kubectl rollout status daemonset/calico-node -n kube-system --timeout=180s
      changed_when: false
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - calico_manifest_url is defined
        - calico_manifest_url != ""

    - name: "Get Calico version after update (When: manifest was applied)"
      command: kubectl get daemonset calico-node -n kube-system -o jsonpath={.spec.template.spec.containers[0].image}
      register: calico_after
      changed_when: false
      ignore_errors: true
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - calico_manifest_url is defined
        - calico_manifest_url != ""

    - name: "Calico version report (When: first control-plane node and kubectl access)"
      debug:
        msg: "Calico: {{ calico_before.stdout | default('unknown') }} -> {{ calico_after.stdout | default(calico_before.stdout) | default('unknown') }}"
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
