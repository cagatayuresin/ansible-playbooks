---
- name: Calico Sürüm Kontrolü ve Güncellemesi
  hosts: master:singlenode
  gather_facts: false

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: "Kubeconfig / kubectl erişim kontrolü (Çalışma Şartı: ilk control-plane node olmalı)"
      command: kubectl cluster-info
      register: kubectl_check
      ignore_errors: true
      changed_when: false
      when: inventory_hostname == first_control_plane

    - name: "Calico mevcut image/sürüm bilgisi (Çalışma Şartı: kubectl erişimi olmalı)"
      command: kubectl get daemonset calico-node -n kube-system -o jsonpath={.spec.template.spec.containers[0].image}
      register: calico_before
      changed_when: false
      ignore_errors: true
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0

    - name: "Calico manifestini uygula (Çalışma Şartı: calico_manifest_url verilmiş olmalı)"
      command: kubectl apply -f {{ calico_manifest_url }}
      register: calico_apply
      changed_when: true
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - calico_manifest_url is defined
        - calico_manifest_url != ""

    - name: "calico_manifest_url verilmedi uyarısı (Çalışma Şartı: calico_manifest_url verilMEMİŞ olmalı)"
      debug:
        msg: >-
          calico_manifest_url belirtilmedi, güncelleme yapılmadı. Örnek kullanım:
          --extra-vars "calico_manifest_url=<resmi manifest URL'i>"
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - calico_manifest_url is not defined or calico_manifest_url == ""

    - name: "Calico DaemonSet'in yeniden dağıtılmasını bekle (Çalışma Şartı: manifest uygulanmış olmalı)"
      command: kubectl rollout status daemonset/calico-node -n kube-system --timeout=180s
      changed_when: false
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - calico_manifest_url is defined
        - calico_manifest_url != ""

    - name: "Calico güncelleme sonrası sürüm bilgisi (Çalışma Şartı: manifest uygulanmış olmalı)"
      command: kubectl get daemonset calico-node -n kube-system -o jsonpath={.spec.template.spec.containers[0].image}
      register: calico_after
      changed_when: false
      ignore_errors: true
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - calico_manifest_url is defined
        - calico_manifest_url != ""

    - name: "Calico sürüm raporu (Çalışma Şartı: ilk control-plane node olmalı ve kubectl erişimi olmalı)"
      debug:
        msg: "Calico: {{ calico_before.stdout | default('bilinmiyor') }} -> {{ calico_after.stdout | default(calico_before.stdout) | default('bilinmiyor') }}"
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
