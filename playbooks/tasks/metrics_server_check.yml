---
# Shared: is metrics-server installed/ready? Produces facts.
# Expected play vars: first_control_plane
# Produces: kubectl_check, metrics_server_deploy, metrics_server_api,
#         metrics_server_pods, metrics_server_ready

- name: "Kubeconfig / kubectl access check (When: must be the first control-plane node)"
  command: kubectl cluster-info
  register: kubectl_check
  ignore_errors: true
  changed_when: false
  check_mode: false

- name: "Does metrics-server Deployment exist (When: kubectl access is required)"
  command: kubectl -n kube-system get deploy metrics-server -o wide
  register: metrics_server_deploy
  ignore_errors: true
  changed_when: false
  check_mode: false
  when: kubectl_check.rc == 0

- name: "Is metrics.k8s.io APIService Available (When: kubectl access is required)"
  shell: >
    kubectl get apiservice v1beta1.metrics.k8s.io
    -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
  register: metrics_server_api
  ignore_errors: true
  changed_when: false
  check_mode: false
  when: kubectl_check.rc == 0

- name: "metrics-server pod status (When: kubectl access is required)"
  command: kubectl -n kube-system get pods -l k8s-app=metrics-server -o wide
  register: metrics_server_pods
  ignore_errors: true
  changed_when: false
  check_mode: false
  when: kubectl_check.rc == 0

- name: Set metrics_server_ready fact
  set_fact:
    metrics_server_ready: "{{ (kubectl_check.rc | default(1) == 0) and (metrics_server_deploy.rc | default(1) == 0) and ((metrics_server_api.stdout | default('') | trim) == 'True') }}"
