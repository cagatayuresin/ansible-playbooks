---
# Container image inventory / prune on the host.
# Play vars: image_inventory_mode = report | unused | prune
# Produces: image_inventory (stdout report)

- name: Is Docker present
  command: which docker
  register: docker_bin
  ignore_errors: true
  changed_when: false
  check_mode: false

- name: Is crictl present
  command: which crictl
  register: crictl_bin
  ignore_errors: true
  changed_when: false
  check_mode: false

- name: "Container image inventory / prune (When: docker or crictl is required)"
  become: true
  script: "container_images_inventory.py --mode {{ image_inventory_mode | default('report') }}"
  args:
    executable: python3
  register: image_inventory
  changed_when: (image_inventory_mode | default('report')) == 'prune'
  ignore_errors: true
  check_mode: false
  when: docker_bin.rc == 0 or crictl_bin.rc == 0

- name: Container image inventory / prune report
  debug:
    msg:
      - |
        ################################################################################
        # HOST: {{ inventory_hostname }}
        # hostname: {{ ansible_facts['hostname'] | default('n/a') }}
        # mode: {{ image_inventory_mode | default('report') }}
        ################################################################################
      - |
        Runtime: {{
          (
            (['docker'] if docker_bin.rc == 0 else [])
            + (['crictl/containerd'] if crictl_bin.rc == 0 else [])
          ) | join(' + ')
          if (docker_bin.rc == 0 or crictl_bin.rc == 0)
          else 'none'
        }}
      - "{{ image_inventory.stdout | default(image_inventory.stderr | default('Report could not be generated')) if image_inventory is defined else 'docker/crictl missing — skipped' }}"
      - |
        Details: docs/17_check_container_images.md / docs/18_prune_unused_images.md
