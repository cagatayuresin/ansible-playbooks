---
- name: Validate target Kubernetes version format
  assert:
    that:
      - (kube_version | default('') | string) is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: >-
      kube_version is required and must consist of numeric components in X.Y.Z
      format only. Example: --extra-vars "kube_version=1.34.3".
  run_once: true
