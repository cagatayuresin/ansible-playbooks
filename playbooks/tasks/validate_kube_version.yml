---
- name: Hedef Kubernetes sürüm biçimini doğrula
  assert:
    that:
      - (kube_version | default('') | string) is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: >-
      kube_version zorunludur ve X.Y.Z biçiminde yalnızca sayısal bileşenlerden
      oluşmalıdır. Örnek: --extra-vars "kube_version=1.34.3".
  run_once: true
