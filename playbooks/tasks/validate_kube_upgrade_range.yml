---
- name: Current kubeadm version must be readable
  assert:
    that:
      - kubeadm_version.rc == 0
      - (kubeadm_version.stdout | trim) is match('^v[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$')
    fail_msg: >-
      Current kubeadm version could not be read reliably; the operation was
      stopped on this node because the safe upgrade range could not be validated.

- name: Prepare current and target Kubernetes version components
  set_fact:
    current_kube_version_parts: >-
      {{
        (
          kubeadm_version.stdout
          | trim
          | regex_replace('^v', '')
          | regex_replace('[+-].*$', '')
        ).split('.')
        | map('int')
        | list
      }}
    target_kube_version_parts: "{{ kube_version.split('.') | map('int') | list }}"

- name: Validate Kubernetes upgrade range
  assert:
    that:
      - target_kube_version_parts[0] == current_kube_version_parts[0]
      - target_kube_version_parts[1] >= current_kube_version_parts[1]
      - target_kube_version_parts[1] <= current_kube_version_parts[1] + 1
      - >-
        target_kube_version_parts[1] > current_kube_version_parts[1]
        or target_kube_version_parts[2] >= current_kube_version_parts[2]
    fail_msg: >-
      Unsupported upgrade: current {{ kubeadm_version.stdout | trim }},
      target v{{ kube_version }}. The major version cannot be changed, the minor
      version cannot be decreased or increased by more than one, and the patch
      version cannot be decreased within the same minor.
