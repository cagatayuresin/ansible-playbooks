---
# Shared: if metrics-server is missing, install it from the official manifest, adding insecure-tls if needed.
# Expected play vars: first_control_plane, metrics_server_manifest_url,
#                      metrics_server_kubelet_insecure_tls
# metrics_server_check must have run first (metrics_server_ready fact).

- name: "metrics-server already ready, skipping install"
  debug:
    msg: "metrics-server is already installed and the API is Available — no install was performed."
  when: metrics_server_ready | default(false) | bool

- name: "Apply metrics-server manifest (When: must NOT be installed/ready)"
  command:
    argv:
      - kubectl
      - apply
      - -f
      - "{{ metrics_server_manifest_url }}"
  register: metrics_server_apply
  changed_when: true
  when: not (metrics_server_ready | default(false) | bool)

- name: "Add kubelet-insecure-tls argument (When: install was performed and flag is enabled)"
  shell: |
    set -e
    args="$(kubectl -n kube-system get deploy metrics-server -o jsonpath='{.spec.template.spec.containers[0].args}')"
    if echo "$args" | grep -q -- '--kubelet-insecure-tls'; then
      echo "kubelet-insecure-tls already present"
      exit 0
    fi
    kubectl -n kube-system patch deployment metrics-server --type='json' \
      -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
  register: metrics_server_patch
  changed_when: "'patched' in (metrics_server_patch.stdout | default(''))"
  when:
    - not (metrics_server_ready | default(false) | bool)
    - metrics_server_kubelet_insecure_tls | default(true) | bool
    - metrics_server_apply is defined
    - metrics_server_apply is not skipped
    - metrics_server_apply.rc | default(1) == 0

- name: "Wait for metrics-server rollout to complete (When: install was performed)"
  command: kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s
  register: metrics_server_rollout
  changed_when: false
  when:
    - not (metrics_server_ready | default(false) | bool)
    - metrics_server_apply is defined
    - metrics_server_apply is not skipped
    - metrics_server_apply.rc | default(1) == 0

- name: "Retry until kubectl top is ready (When: install was performed)"
  command: kubectl top nodes
  register: metrics_top_wait
  retries: 12
  delay: 10
  until: metrics_top_wait.rc == 0
  changed_when: false
  ignore_errors: true
  check_mode: false
  when:
    - not (metrics_server_ready | default(false) | bool)
    - metrics_server_apply is defined
    - metrics_server_apply is not skipped
    - metrics_server_apply.rc | default(1) == 0
