---
- name: Kubernetes/container service status and logs
  hosts: all
  gather_facts: false

  vars:
    k8s_service_patterns:
      - kube
      - containerd
      - calico
      - etcd
      - runc

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Discover all services on the host
      service_facts:

    - name: Filter Kubernetes/container-related services
      set_fact:
        k8s_services: "{{ ansible_facts.services.keys() | select('search', k8s_service_patterns | join('|')) | list }}"

    - name: "Service status report - active/enabled (When: matching service exists)"
      debug:
        msg: "{{ item }} -> state: {{ ansible_facts.services[item].get('state', 'unknown') }}, enabled at boot: {{ ansible_facts.services[item].get('status', 'unknown') }}"
      loop: "{{ k8s_services }}"
      loop_control:
        label: "{{ item }}"
      when: k8s_services | length > 0

    - name: "No matching service warning (When: no matching service exists)"
      debug:
        msg: "No Kubernetes/container-related service found on this host."
      when: k8s_services | length == 0

    - name: Collect recent logs for matching services
      command: journalctl -u {{ item }} -n 10 --no-pager
      register: service_logs
      loop: "{{ k8s_services }}"
      loop_control:
        label: "{{ item }}"
      ignore_errors: true
      changed_when: false

    - name: "Service log report (When: logs can be collected)"
      debug:
        msg: "===== {{ item.item }} recent logs =====\n{{ item.stdout | default('Could not collect logs: ' + (item.stderr | default('unknown error'))) }}"
      loop: "{{ service_logs.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
