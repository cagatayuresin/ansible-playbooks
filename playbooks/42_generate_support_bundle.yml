---
- name: Generate Kubernetes and System Support Bundle
  hosts: master:singlenode
  gather_facts: true
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"
    support_bundle_redact: true
    support_bundle_keep_remote: false
    support_bundle_local_dir: "{{ playbook_dir }}/../support-bundles"
    support_bundle_remote_path: >-
      /tmp/ansible-support-bundle-{{
        inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_')
      }}-{{ ansible_date_time.iso8601_basic_short }}.tar.gz

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Create support bundle directory on the controller
      file:
        path: "{{ support_bundle_local_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: inventory_hostname == first_control_plane

    - name: Create support bundle on the target host
      become: true
      script: >-
        files/support_bundle_collect.py
        --output {{ support_bundle_remote_path | quote }}
        --redact {{ (support_bundle_redact | bool) | ternary('true', 'false') | quote }}
      register: support_bundle_result
      changed_when: true
      when: inventory_hostname == first_control_plane

    - name: Fetch support bundle archive to the controller
      become: true
      fetch:
        src: "{{ support_bundle_remote_path }}"
        dest: "{{ support_bundle_local_dir }}/"
        flat: true
      register: support_bundle_fetch
      when: inventory_hostname == first_control_plane

    - name: Remove temporary support bundle on the target host
      become: true
      file:
        path: "{{ support_bundle_remote_path }}"
        state: absent
      when:
        - inventory_hostname == first_control_plane
        - not (support_bundle_keep_remote | bool)

    - name: Support bundle result
      debug:
        msg:
          - "{{ support_bundle_result.stdout_lines | default([]) }}"
          - "Controller archive: {{ support_bundle_fetch.dest | default(support_bundle_local_dir) }}"
      when: inventory_hostname == first_control_plane
