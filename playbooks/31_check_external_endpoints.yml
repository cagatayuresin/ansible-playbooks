---
- name: External Endpoint Connectivity Test
  hosts: localhost
  gather_facts: false

  vars:
    # List of endpoints to test
    endpoints:
      - name: "Google API"
        url: "https://www.google.com"
      - name: "Example Endpoint"
        url: "https://api.github.com"

  tasks:
    - name: Send HTTP requests to external services and measure latency
      uri:
        url: "{{ item.url }}"
        method: GET
        timeout: 5
        return_content: false
      register: uri_results
      loop: "{{ endpoints }}"
      ignore_errors: true

    - name: Connectivity results report
      debug:
        msg: |
          [{% if item.status | default(0) == 200 %}OK{% else %}FAIL{% endif %}] {{ item.item.name }} ({{ item.item.url }})
          Status code: {{ item.status | default('Connection error') }}
          Elapsed time: {{ item.elapsed | default('N/A') }} seconds
      loop: "{{ uri_results.results }}"
