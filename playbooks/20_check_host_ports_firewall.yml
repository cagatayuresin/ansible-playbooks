---
- name: Host open ports and firewall report
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Collect port and firewall info
      become: true
      script: host_ports_firewall_check.py
      args:
        executable: python3
      register: ports_fw
      changed_when: false
      ignore_errors: true
      check_mode: false

    - name: Port / firewall report
      debug:
        msg:
          - |
            ################################################################################
            # HOST: {{ inventory_hostname }}
            # hostname: {{ ansible_facts['hostname'] | default('n/a') }}
            ################################################################################
          - "{{ ports_fw.stdout | default(ports_fw.stderr | default('Report could not be generated')) }}"
