---
- name: Journalctl kernel and error log report
  hosts: all
  gather_facts: true

  vars:
    # Overridable via --extra-vars: journal_since="6 hours ago" journal_lines=120
    journal_since: "24 hours ago"
    journal_lines: 80

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Kernel logs (err and above)
      become: true
      command:
        argv:
          - journalctl
          - -k
          - -p
          - err..emerg
          - --since
          - "{{ journal_since }}"
          - -n
          - "{{ journal_lines }}"
          - --no-pager
          - --output=short-iso
      register: journal_kernel_err
      changed_when: false
      ignore_errors: true
      check_mode: false

    - name: Kernel logs (warning)
      become: true
      command:
        argv:
          - journalctl
          - -k
          - -p
          - warning
          - --since
          - "{{ journal_since }}"
          - -n
          - "{{ journal_lines }}"
          - --no-pager
          - --output=short-iso
      register: journal_kernel_warn
      changed_when: false
      ignore_errors: true
      check_mode: false

    - name: System-wide error logs (err and above, all units)
      become: true
      command:
        argv:
          - journalctl
          - -p
          - err..emerg
          - --since
          - "{{ journal_since }}"
          - -n
          - "{{ journal_lines }}"
          - --no-pager
          - --output=short-iso
      register: journal_system_err
      changed_when: false
      ignore_errors: true
      check_mode: false

    - name: Kernel errors on this boot (err and above)
      become: true
      command:
        argv:
          - journalctl
          - -k
          - -b
          - -p
          - err..emerg
          - -n
          - "{{ journal_lines }}"
          - --no-pager
          - --output=short-iso
      register: journal_boot_kernel_err
      changed_when: false
      ignore_errors: true
      check_mode: false

    - name: Journal error / kernel log report
      vars:
        _host_banner: |
          ################################################################################
          # HOST: {{ inventory_hostname }}
          # hostname: {{ ansible_facts['hostname'] | default('n/a') }}
          # window: {{ journal_since }} | line limit/section: {{ journal_lines }}
          ################################################################################
        _k_err: "{{ journal_kernel_err.stdout | default(journal_kernel_err.stderr | default('')) | trim }}"
        _k_warn: "{{ journal_kernel_warn.stdout | default(journal_kernel_warn.stderr | default('')) | trim }}"
        _s_err: "{{ journal_system_err.stdout | default(journal_system_err.stderr | default('')) | trim }}"
        _b_err: "{{ journal_boot_kernel_err.stdout | default(journal_boot_kernel_err.stderr | default('')) | trim }}"
        _empty: "-- No records in this window / at this priority --"
      debug:
        msg:
          - "{{ _host_banner }}"
          - |
            === Kernel ERR+ ({{ journal_since }}) ===
            Note: OOM, I/O error, firmware, NMI, disk/NVMe, network driver errors. Empty is a good sign.
            {{ _k_err if _k_err | length > 0 else _empty }}
          - |
            === Kernel WARNING ({{ journal_since }}) ===
            Note: Not fatal yet, but may signal upcoming trouble (retry, throttling, deprecated).
            {{ _k_warn if _k_warn | length > 0 else _empty }}
          - |
            === System ERR+ all units ({{ journal_since }}) ===
            Note: Service crashes, auth fail, unit failure. Non-kernel issues show up here.
            {{ _s_err if _s_err | length > 0 else _empty }}
          - |
            === This boot kernel ERR+ ===
            Note: Kernel errors since last reboot (independent of the since filter).
            {{ _b_err if _b_err | length > 0 else _empty }}
          - |
            Detailed notes: docs/13_check_journal_errors.md
