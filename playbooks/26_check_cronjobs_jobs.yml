---
- name: CronJob / Job report
  hosts: master:singlenode
  gather_facts: true
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"
    # Empty = all namespaces; set = that namespace only
    jobs_namespace: ""

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Generate CronJob / Job report
      script: >-
        k8s_cronjobs_jobs_check.py
        --namespace {{ jobs_namespace | default('') | quote }}
      args:
        executable: python3
      register: jobs_report
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: inventory_hostname == first_control_plane

    - name: CronJob / Job report
      debug:
        msg:
          - |
            ################################################################################
            # HOST: {{ inventory_hostname }}
            # hostname: {{ ansible_facts['hostname'] | default('n/a') }}
            # namespace: {{ jobs_namespace if (jobs_namespace | default('') | length) > 0 else 'ALL' }}
            ################################################################################
          - "{{ jobs_report.stdout | default(jobs_report.stderr | default('Report could not be generated')) }}"
      when: inventory_hostname == first_control_plane
