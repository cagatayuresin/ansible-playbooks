---
- name: Server system health report
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Collect uptime
      command: uptime -p
      register: uptime_info
      changed_when: false
      check_mode: false

    - name: Collect load average and run queue
      command: cat /proc/loadavg
      register: loadavg_info
      changed_when: false
      check_mode: false

    - name: Count zombie (defunct) processes
      shell: ps -eo stat | grep -c '^Z' || true
      register: zombie_count
      changed_when: false
      check_mode: false

    - name: Detect virtualization type
      command: systemd-detect-virt
      register: virt_detect
      changed_when: false
      ignore_errors: true
      check_mode: false

    - name: "Hypervisor hardware info (When: dmidecode is installed and reachable)"
      become: true
      shell: |
        echo "Manufacturer: $(dmidecode -s system-manufacturer 2>/dev/null)"
        echo "Product: $(dmidecode -s system-product-name 2>/dev/null)"
        echo "BIOS Version: $(dmidecode -s bios-version 2>/dev/null)"
      register: hypervisor_info
      changed_when: false
      ignore_errors: true
      check_mode: false

    - name: Memory usage
      command: free -h
      register: memory_info
      changed_when: false
      check_mode: false

    - name: "Disk usage (When: real filesystems)"
      command: df -hT -x tmpfs -x devtmpfs -x squashfs -x overlay -x efivarfs
      register: disk_info
      changed_when: false
      check_mode: false

    - name: Top 10 CPU-consuming processes
      shell: ps -eo pid,comm,%cpu,%mem --sort=-%cpu | head -n 11
      register: top_cpu
      changed_when: false
      check_mode: false

    - name: Top 10 RAM-consuming processes
      shell: ps -eo pid,comm,%mem,%cpu --sort=-%mem | head -n 11
      register: top_mem
      changed_when: false
      check_mode: false

    - name: Check whether reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Failed systemd services
      command: systemctl --failed --no-legend
      register: failed_units
      changed_when: false
      ignore_errors: true
      check_mode: false

    - name: Count available package/security updates
      shell: apt list --upgradable 2>/dev/null | tail -n +2 | wc -l
      register: upgradable_count
      changed_when: false
      ignore_errors: true
      check_mode: false

    - name: System health report
      debug:
        msg:
          - |
            ################################################################################
            # HOST: {{ inventory_hostname }}
            # hostname: {{ ansible_facts['hostname'] | default('n/a') }}
            ################################################################################
          - "OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} ({{ ansible_facts['distribution_release'] }})"
          - "Kernel: {{ ansible_facts['kernel'] }}"
          - "Uptime: {{ uptime_info.stdout }}"
          - "CPU cores: {{ ansible_facts['processor_vcpus'] | default(ansible_facts['processor_count']) }}"
          - "Load average (1/5/15 min): {{ loadavg_info.stdout.split(' ')[0] }} / {{ loadavg_info.stdout.split(' ')[1] }} / {{ loadavg_info.stdout.split(' ')[2] }} (1min per core: {{ (loadavg_info.stdout.split(' ')[0] | float / (ansible_facts['processor_vcpus'] | default(ansible_facts['processor_count']))) | round(2) }})"
          - "Run queue (running/total processes): {{ loadavg_info.stdout.split(' ')[3] }}"
          - "Zombie (defunct) process count: {{ zombie_count.stdout | trim }}"
          - "Virtualization: role={{ ansible_facts['virtualization_role'] | default('unknown') }}, type={{ ansible_facts['virtualization_type'] | default('unknown') }}, systemd-detect-virt={{ virt_detect.stdout | default('not detected') }}"
          - "Hardware/hypervisor info:\n{{ hypervisor_info.stdout | default('dmidecode not available (sudo/install may be required)') }}"
          - "Memory:\n{{ memory_info.stdout }}"
          - "Disk usage:\n{{ disk_info.stdout }}"
          - "Top 10 CPU-consuming processes:\n{{ top_cpu.stdout }}"
          - "Top 10 RAM-consuming processes:\n{{ top_mem.stdout }}"
          - "Reboot required: {{ 'YES' if reboot_required.stat.exists else 'No' }}"
          - "Failed systemd services: {{ failed_units.stdout if (failed_units.stdout | default('')) | trim != '' else 'None' }}"
          - "Available package updates: {{ upgradable_count.stdout | default('unknown') }}"
