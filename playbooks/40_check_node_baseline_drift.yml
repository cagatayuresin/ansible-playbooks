---
- name: Kubernetes and Linux Node Baseline Drift Check
  hosts: all
  gather_facts: true

  vars:
    node_baseline_compare_fields:
      - os_id
      - os_version
      - kernel
      - architecture
      - cgroup_version
      - swap_enabled
      - ip_forward
      - bridge_nf_iptables
      - br_netfilter_loaded
      - overlay_loaded
      - containerd_version
      - containerd_config_sha256
      - containerd_systemd_cgroup
      - kubelet_version
      - kubelet_config_sha256
      - kubelet_cgroup_driver
      - time_sync_service
      - reboot_required

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Collect node baseline data
      become: true
      script: files/node_baseline_collect.py
      register: node_baseline_raw
      changed_when: false
      failed_when: false

    - name: Save node baseline data as a fact
      set_fact:
        node_baseline_data: "{{ node_baseline_raw.stdout | from_json }}"
      when: node_baseline_raw.rc == 0

    - name: Node baseline collection error
      debug:
        msg: "{{ node_baseline_raw.stderr_lines | default(node_baseline_raw.stdout_lines | default(['Unknown error'])) }}"
      when: node_baseline_raw.rc != 0

    - name: Per-host node baseline report
      debug:
        msg: "{{ node_baseline_data | to_nice_json }}"
      when: node_baseline_data is defined

    - name: Cross-node drift summary
      debug:
        msg: >-
          {{ '[DRIFT]' if (baseline_values | length) > 1 else '[OK]' }}
          {{ item }} = {{ baseline_values }}
      vars:
        baseline_values: >-
          {{
            ansible_play_hosts
            | map('extract', hostvars, 'node_baseline_data')
            | select('defined')
            | map(attribute=item, default='unavailable')
            | unique
            | list
          }}
      loop: "{{ node_baseline_compare_fields }}"
      run_once: true
      delegate_to: localhost
      become: false
