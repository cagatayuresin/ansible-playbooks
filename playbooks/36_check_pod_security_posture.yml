---
- name: Kubernetes Pod Güvenlik Duruşu Kontrolü
  hosts: master:singlenode
  gather_facts: false
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"
    pod_security_excluded_namespaces: "kube-system,kube-public,kube-node-lease"
    pod_security_max_findings: 400

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Pod güvenlik duruşu analizini çalıştır
      script: >-
        files/k8s_pod_security_posture_check.py
        --exclude-namespaces {{ pod_security_excluded_namespaces | quote }}
        --max-findings {{ pod_security_max_findings | string | quote }}
      register: pod_security_result
      changed_when: false
      failed_when: false
      when: inventory_hostname == first_control_plane

    - name: Pod güvenlik duruşu raporu
      debug:
        msg: "{{ pod_security_result.stdout | default(pod_security_result.stderr | default('Rapor üretilemedi')) }}"
      when: inventory_hostname == first_control_plane
