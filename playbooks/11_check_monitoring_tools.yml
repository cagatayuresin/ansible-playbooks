---
- name: Sistem İzleme Araçları Kontrolü
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

  tasks:
    # ---------- vmstat ----------
    - name: vmstat kurulu mu kontrol et
      command: which vmstat
      register: vmstat_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "vmstat (procps) paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: procps
        state: present
        update_cache: true
      ignore_errors: true
      when: vmstat_present.rc != 0

    - name: vmstat kurulumunu doğrula
      command: which vmstat
      register: vmstat_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: vmstat ile salt-okunur kontrol
      command: vmstat 1 3
      register: vmstat_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: vmstat_ready.rc == 0

    # ---------- iostat + sar (sysstat paketi) ----------
    - name: iostat kurulu mu kontrol et
      command: which iostat
      register: iostat_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: sar kurulu mu kontrol et
      command: which sar
      register: sar_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "sysstat paketini kur - iostat ve sar sağlar (Çalışma Şartı: ikisinden biri kurulu olmamalı)"
      become: true
      apt:
        name: sysstat
        state: present
        update_cache: true
      ignore_errors: true
      when: iostat_present.rc != 0 or sar_present.rc != 0

    - name: iostat kurulumunu doğrula
      command: which iostat
      register: iostat_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: sar kurulumunu doğrula
      command: which sar
      register: sar_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: iostat ile salt-okunur kontrol
      command: iostat -xz 1 2
      register: iostat_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: iostat_ready.rc == 0

    - name: sar ile salt-okunur kontrol
      command: sar 1 2
      register: sar_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: sar_ready.rc == 0

    # ---------- htop (interaktif, sadece kurulum kontrolü) ----------
    - name: htop kurulu mu kontrol et
      command: which htop
      register: htop_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "htop paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: htop
        state: present
        update_cache: true
      ignore_errors: true
      when: htop_present.rc != 0

    - name: htop kurulumunu doğrula
      command: which htop
      register: htop_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    # ---------- dstat ----------
    - name: dstat kurulu mu kontrol et
      command: which dstat
      register: dstat_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "dstat paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: dstat
        state: present
        update_cache: true
      ignore_errors: true
      when: dstat_present.rc != 0

    - name: dstat kurulumunu doğrula
      command: which dstat
      register: dstat_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: dstat ile salt-okunur kontrol
      command: dstat -cdngy --nocolor 1 1
      register: dstat_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: dstat_ready.rc == 0

    # ---------- iotop ----------
    - name: iotop kurulu mu kontrol et
      command: which iotop
      register: iotop_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "iotop paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: iotop
        state: present
        update_cache: true
      ignore_errors: true
      when: iotop_present.rc != 0

    - name: iotop kurulumunu doğrula
      command: which iotop
      register: iotop_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: iotop ile salt-okunur kontrol
      become: true
      command: iotop -b -n 1 -o
      register: iotop_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: iotop_ready.rc == 0

    # ---------- atop ----------
    - name: atop kurulu mu kontrol et
      command: which atop
      register: atop_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "atop paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: atop
        state: present
        update_cache: true
      ignore_errors: true
      when: atop_present.rc != 0

    - name: atop kurulumunu doğrula
      command: which atop
      register: atop_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: atop ile salt-okunur kontrol
      become: true
      shell: atop 1 1 | awk '/PID.*CMD/{exit} {print}'
      register: atop_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: atop_ready.rc == 0

    # ---------- perf ----------
    - name: perf kurulu mu kontrol et
      command: which perf
      register: perf_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "perf (linux-tools) paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name:
          - linux-tools-common
          - "linux-tools-{{ ansible_facts['kernel'] }}"
        state: present
        update_cache: true
      ignore_errors: true
      when: perf_present.rc != 0

    - name: perf kurulumunu doğrula
      command: which perf
      register: perf_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: perf ile salt-okunur kontrol
      become: true
      command: perf stat -a -- sleep 1
      register: perf_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: perf_ready.rc == 0

    # ---------- bpftrace (sadece kurulum + sürüm, izleme betiği çalıştırılmaz) ----------
    - name: bpftrace kurulu mu kontrol et
      command: which bpftrace
      register: bpftrace_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "bpftrace paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: bpftrace
        state: present
        update_cache: true
      ignore_errors: true
      when: bpftrace_present.rc != 0

    - name: bpftrace kurulumunu doğrula
      command: which bpftrace
      register: bpftrace_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: bpftrace sürümünü al
      command: bpftrace --version
      register: bpftrace_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: bpftrace_ready.rc == 0

    # ---------- glances ----------
    - name: glances kurulu mu kontrol et
      command: which glances
      register: glances_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "glances paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: glances
        state: present
        update_cache: true
      ignore_errors: true
      when: glances_present.rc != 0

    - name: glances kurulumunu doğrula
      command: which glances
      register: glances_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: glances ile salt-okunur kontrol
      shell: timeout 3 glances --stdout now,cpu.total,mem.percent,mem.used,mem.total,load.min1 || true
      register: glances_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: glances_ready.rc == 0

    # ---------- Rapor ----------
    - name: İzleme araçları raporu
      debug:
        msg:
          - "vmstat: {{ 'kurulu' if vmstat_ready.rc == 0 else 'kurulamadı' }}\n{{ vmstat_output.stdout | default('') }}"
          - "iostat: {{ 'kurulu' if iostat_ready.rc == 0 else 'kurulamadı' }}\n{{ iostat_output.stdout | default('') }}"
          - "sar: {{ 'kurulu' if sar_ready.rc == 0 else 'kurulamadı' }}\n{{ sar_output.stdout | default('') }}"
          - "htop: {{ 'kurulu (interaktif araç, otomatik rapor üretilmez)' if htop_ready.rc == 0 else 'kurulamadı' }}"
          - "dstat: {{ 'kurulu' if dstat_ready.rc == 0 else 'kurulamadı' }}\n{{ dstat_output.stdout | default('') }}"
          - "iotop: {{ 'kurulu' if iotop_ready.rc == 0 else 'kurulamadı' }}\n{{ iotop_output.stdout | default('') }}"
          - "atop: {{ 'kurulu' if atop_ready.rc == 0 else 'kurulamadı' }}\n{{ atop_output.stdout | default('') }}"
          - "perf: {{ 'kurulu' if perf_ready.rc == 0 else 'kurulamadı' }}\n{{ perf_output.stderr | default(perf_output.stdout | default('')) }}"
          - "bpftrace: {{ ('kurulu, sürüm: ' + (bpftrace_output.stdout | default('bilinmiyor'))) if bpftrace_ready.rc == 0 else 'kurulamadı' }}"
          - "glances: {{ 'kurulu' if glances_ready.rc == 0 else 'kurulamadı' }}\n{{ glances_output.stdout | default('') }}"
