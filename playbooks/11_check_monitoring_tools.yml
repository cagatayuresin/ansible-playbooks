---
- name: System monitoring tools check
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    # ---------- vmstat ----------
    - name: Check whether vmstat is installed
      command: which vmstat
      register: vmstat_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "Install vmstat (procps) package (When: not installed)"
      become: true
      apt:
        name: procps
        state: present
        update_cache: true
      ignore_errors: true
      when: vmstat_present.rc != 0

    - name: Verify vmstat installation
      command: which vmstat
      register: vmstat_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Read-only vmstat check
      command: vmstat 1 3
      register: vmstat_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: vmstat_ready.rc == 0

    # ---------- iostat + sar (sysstat package) ----------
    - name: Check whether iostat is installed
      command: which iostat
      register: iostat_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Check whether sar is installed
      command: which sar
      register: sar_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "Install sysstat package - provides iostat and sar (When: either is not installed)"
      become: true
      apt:
        name: sysstat
        state: present
        update_cache: true
      ignore_errors: true
      when: iostat_present.rc != 0 or sar_present.rc != 0

    - name: Verify iostat installation
      command: which iostat
      register: iostat_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Verify sar installation
      command: which sar
      register: sar_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Read-only iostat check
      command: iostat -xz 1 2
      register: iostat_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: iostat_ready.rc == 0

    - name: Read-only sar check
      command: sar 1 2
      register: sar_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: sar_ready.rc == 0

    # ---------- htop (interactive, install check only) ----------
    - name: Check whether htop is installed
      command: which htop
      register: htop_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "Install htop package (When: not installed)"
      become: true
      apt:
        name: htop
        state: present
        update_cache: true
      ignore_errors: true
      when: htop_present.rc != 0

    - name: Verify htop installation
      command: which htop
      register: htop_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    # ---------- dstat ----------
    - name: Check whether dstat is installed
      command: which dstat
      register: dstat_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "Install dstat package (When: not installed)"
      become: true
      apt:
        name: dstat
        state: present
        update_cache: true
      ignore_errors: true
      when: dstat_present.rc != 0

    - name: Verify dstat installation
      command: which dstat
      register: dstat_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Read-only dstat check
      command: dstat -cdngy --nocolor 1 1
      register: dstat_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: dstat_ready.rc == 0

    # ---------- iotop ----------
    - name: Check whether iotop is installed
      command: which iotop
      register: iotop_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "Install iotop package (When: not installed)"
      become: true
      apt:
        name: iotop
        state: present
        update_cache: true
      ignore_errors: true
      when: iotop_present.rc != 0

    - name: Verify iotop installation
      command: which iotop
      register: iotop_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Read-only iotop check
      become: true
      command: iotop -b -n 1 -o
      register: iotop_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: iotop_ready.rc == 0

    # ---------- atop ----------
    - name: Check whether atop is installed
      command: which atop
      register: atop_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "Install atop package (When: not installed)"
      become: true
      apt:
        name: atop
        state: present
        update_cache: true
      ignore_errors: true
      when: atop_present.rc != 0

    - name: Verify atop installation
      command: which atop
      register: atop_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Read-only atop check
      become: true
      shell: atop 1 1 | awk '/PID.*CMD/{exit} {print}'
      register: atop_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: atop_ready.rc == 0

    # ---------- perf ----------
    - name: Check whether perf is installed
      command: which perf
      register: perf_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "Install perf (linux-tools) package (When: not installed)"
      become: true
      apt:
        name:
          - linux-tools-common
          - "linux-tools-{{ ansible_facts['kernel'] }}"
        state: present
        update_cache: true
      ignore_errors: true
      when: perf_present.rc != 0

    - name: Verify perf installation
      command: which perf
      register: perf_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Read-only perf check
      become: true
      command: perf stat -a -- sleep 1
      register: perf_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: perf_ready.rc == 0

    # ---------- bpftrace (install + version only, no tracing script) ----------
    - name: Check whether bpftrace is installed
      command: which bpftrace
      register: bpftrace_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "Install bpftrace package (When: not installed)"
      become: true
      apt:
        name: bpftrace
        state: present
        update_cache: true
      ignore_errors: true
      when: bpftrace_present.rc != 0

    - name: Verify bpftrace installation
      command: which bpftrace
      register: bpftrace_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Get bpftrace version
      command: bpftrace --version
      register: bpftrace_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: bpftrace_ready.rc == 0

    # ---------- glances ----------
    - name: Check whether glances is installed
      command: which glances
      register: glances_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "Install glances package (When: not installed)"
      become: true
      apt:
        name: glances
        state: present
        update_cache: true
      ignore_errors: true
      when: glances_present.rc != 0

    - name: Verify glances installation
      command: which glances
      register: glances_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Read-only glances check
      shell: timeout 3 glances --stdout now,cpu.total,mem.percent,mem.used,mem.total,load.min1 || true
      register: glances_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: glances_ready.rc == 0

    # ---------- Report ----------
    # Column meanings: docs/11_check_monitoring_tools.md
    - name: Monitoring tools report
      vars:
        _vmstat: "{{ ((vmstat_output.stdout | default('')) ~ ('\n' ~ (vmstat_output.stderr | default('')) if (vmstat_output.stderr | default('')) else '')) if vmstat_output is defined else '' }}"
        _iostat: "{{ ((iostat_output.stdout | default('')) ~ ('\n' ~ (iostat_output.stderr | default('')) if (iostat_output.stderr | default('')) else '')) if iostat_output is defined else '' }}"
        _sar: "{{ ((sar_output.stdout | default('')) ~ ('\n' ~ (sar_output.stderr | default('')) if (sar_output.stderr | default('')) else '')) if sar_output is defined else '' }}"
        _dstat: "{{ ((dstat_output.stdout | default('')) ~ ('\n' ~ (dstat_output.stderr | default('')) if (dstat_output.stderr | default('')) else '')) if dstat_output is defined else '' }}"
        _iotop: "{{ ((iotop_output.stdout | default('')) ~ ('\n' ~ (iotop_output.stderr | default('')) if (iotop_output.stderr | default('')) else '')) if iotop_output is defined else '' }}"
        _atop: "{{ ((atop_output.stdout | default('')) ~ ('\n' ~ (atop_output.stderr | default('')) if (atop_output.stderr | default('')) else '')) if atop_output is defined else '' }}"
        _perf: "{{ ((perf_output.stderr | default('')) ~ ('\n' ~ (perf_output.stdout | default('')) if (perf_output.stdout | default('')) else '')) if perf_output is defined else '' }}"
        _glances: "{{ ((glances_output.stdout | default('')) ~ ('\n' ~ (glances_output.stderr | default('')) if (glances_output.stderr | default('')) else '')) if glances_output is defined else '' }}"
      debug:
        msg:
          - |
            ################################################################################
            # HOST: {{ inventory_hostname }}
            # hostname: {{ ansible_facts['hostname'] | default('n/a') }}
            ################################################################################
          - |
            === vmstat (CPU/memory/swap/I/O overview) ===
            Status: {{ 'installed' if vmstat_ready.rc == 0 else 'not installed' }}
            Note: Look at the last lines — r/b queue; si/so swap pressure; high us+sy + low id = CPU busy; high wa = disk wait
            {{ _vmstat | trim }}
          - |
            === iostat (disk device I/O) ===
            Status: {{ 'installed' if iostat_ready.rc == 0 else 'not installed' }}
            Note: Look at the second sample — %util ~100 or high await = disk bottleneck
            {{ _iostat | trim }}
          - |
            === sar (CPU breakdown) ===
            Status: {{ 'installed' if sar_ready.rc == 0 else 'not installed' }}
            Note: high %user/%system = CPU; high %iowait = I/O; high %steal = noisy neighbor VM
            {{ _sar | trim }}
          - |
            === htop (interactive process viewer) ===
            Status: {{ 'installed — run manually over SSH: htop' if htop_ready.rc == 0 else 'not installed' }}
            Note: No automated sample (TUI). Use it to see which process is using CPU/RAM right now.
          - |
            === dstat (cpu+disk+net one-liner) ===
            Status: {{ 'installed' if dstat_ready.rc == 0 else 'not installed (package may be gone on newer Ubuntu)' }}
            Note: Instant summary; vmstat+iostat is enough if missing
            {{ _dstat | trim }}
          - |
            === iotop (per-process disk I/O) ===
            Status: {{ 'installed' if iotop_ready.rc == 0 else 'not installed' }}
            Note: High DISK READ/WRITE rows = process stressing disk; empty list = no meaningful I/O right now
            {{ _iotop | trim }}
          - |
            === atop (system panel summary) ===
            Status: {{ 'installed' if atop_ready.rc == 0 else 'not installed' }}
            Note: CPU/MEM/DSK/NET blocks; many veth (k8s) interfaces lengthen NET — not an error. Process list truncated.
            {{ _atop | trim }}
          - |
            === perf (hardware/software counters) ===
            Status: {{ 'installed' if perf_ready.rc == 0 else 'not installed' }}
            Note: cycles/instructions/cache; '<not supported>' on a VM is normal, not an error
            {{ _perf | trim }}
          - |
            === bpftrace (eBPF tracing) ===
            Status: {{ ('installed, version: ' ~ (bpftrace_output.stdout | default('unknown') | trim)) if bpftrace_ready.rc == 0 else 'not installed' }}
            Note: No automatic script is run (risky). Use manually over SSH for deep kernel/syscall tracing.
          - |
            === glances (summary dashboard) ===
            Status: {{ 'installed' if glances_ready.rc == 0 else 'not installed' }}
            Note: cpu.total / mem.percent / load.min1 — compare load to core count
            {{ _glances | trim }}
          - |
            Column glossary: docs/11_check_monitoring_tools.md
