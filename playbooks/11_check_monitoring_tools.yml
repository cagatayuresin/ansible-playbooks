---
- name: Sistem İzleme Araçları Kontrolü
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

  tasks:
    # ---------- vmstat ----------
    - name: vmstat kurulu mu kontrol et
      command: which vmstat
      register: vmstat_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "vmstat (procps) paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: procps
        state: present
        update_cache: true
      ignore_errors: true
      when: vmstat_present.rc != 0

    - name: vmstat kurulumunu doğrula
      command: which vmstat
      register: vmstat_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: vmstat ile salt-okunur kontrol
      command: vmstat 1 3
      register: vmstat_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: vmstat_ready.rc == 0

    # ---------- iostat + sar (sysstat paketi) ----------
    - name: iostat kurulu mu kontrol et
      command: which iostat
      register: iostat_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: sar kurulu mu kontrol et
      command: which sar
      register: sar_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "sysstat paketini kur - iostat ve sar sağlar (Çalışma Şartı: ikisinden biri kurulu olmamalı)"
      become: true
      apt:
        name: sysstat
        state: present
        update_cache: true
      ignore_errors: true
      when: iostat_present.rc != 0 or sar_present.rc != 0

    - name: iostat kurulumunu doğrula
      command: which iostat
      register: iostat_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: sar kurulumunu doğrula
      command: which sar
      register: sar_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: iostat ile salt-okunur kontrol
      command: iostat -xz 1 2
      register: iostat_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: iostat_ready.rc == 0

    - name: sar ile salt-okunur kontrol
      command: sar 1 2
      register: sar_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: sar_ready.rc == 0

    # ---------- htop (interaktif, sadece kurulum kontrolü) ----------
    - name: htop kurulu mu kontrol et
      command: which htop
      register: htop_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "htop paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: htop
        state: present
        update_cache: true
      ignore_errors: true
      when: htop_present.rc != 0

    - name: htop kurulumunu doğrula
      command: which htop
      register: htop_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    # ---------- dstat ----------
    - name: dstat kurulu mu kontrol et
      command: which dstat
      register: dstat_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "dstat paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: dstat
        state: present
        update_cache: true
      ignore_errors: true
      when: dstat_present.rc != 0

    - name: dstat kurulumunu doğrula
      command: which dstat
      register: dstat_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: dstat ile salt-okunur kontrol
      command: dstat -cdngy --nocolor 1 1
      register: dstat_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: dstat_ready.rc == 0

    # ---------- iotop ----------
    - name: iotop kurulu mu kontrol et
      command: which iotop
      register: iotop_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "iotop paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: iotop
        state: present
        update_cache: true
      ignore_errors: true
      when: iotop_present.rc != 0

    - name: iotop kurulumunu doğrula
      command: which iotop
      register: iotop_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: iotop ile salt-okunur kontrol
      become: true
      command: iotop -b -n 1 -o
      register: iotop_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: iotop_ready.rc == 0

    # ---------- atop ----------
    - name: atop kurulu mu kontrol et
      command: which atop
      register: atop_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "atop paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: atop
        state: present
        update_cache: true
      ignore_errors: true
      when: atop_present.rc != 0

    - name: atop kurulumunu doğrula
      command: which atop
      register: atop_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: atop ile salt-okunur kontrol
      become: true
      shell: atop 1 1 | awk '/PID.*CMD/{exit} {print}'
      register: atop_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: atop_ready.rc == 0

    # ---------- perf ----------
    - name: perf kurulu mu kontrol et
      command: which perf
      register: perf_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "perf (linux-tools) paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name:
          - linux-tools-common
          - "linux-tools-{{ ansible_facts['kernel'] }}"
        state: present
        update_cache: true
      ignore_errors: true
      when: perf_present.rc != 0

    - name: perf kurulumunu doğrula
      command: which perf
      register: perf_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: perf ile salt-okunur kontrol
      become: true
      command: perf stat -a -- sleep 1
      register: perf_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: perf_ready.rc == 0

    # ---------- bpftrace (sadece kurulum + sürüm, izleme betiği çalıştırılmaz) ----------
    - name: bpftrace kurulu mu kontrol et
      command: which bpftrace
      register: bpftrace_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "bpftrace paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: bpftrace
        state: present
        update_cache: true
      ignore_errors: true
      when: bpftrace_present.rc != 0

    - name: bpftrace kurulumunu doğrula
      command: which bpftrace
      register: bpftrace_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: bpftrace sürümünü al
      command: bpftrace --version
      register: bpftrace_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: bpftrace_ready.rc == 0

    # ---------- glances ----------
    - name: glances kurulu mu kontrol et
      command: which glances
      register: glances_present
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: "glances paketini kur (Çalışma Şartı: kurulu olmamalı)"
      become: true
      apt:
        name: glances
        state: present
        update_cache: true
      ignore_errors: true
      when: glances_present.rc != 0

    - name: glances kurulumunu doğrula
      command: which glances
      register: glances_ready
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: glances ile salt-okunur kontrol
      shell: timeout 3 glances --stdout now,cpu.total,mem.percent,mem.used,mem.total,load.min1 || true
      register: glances_output
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: glances_ready.rc == 0

    # ---------- Rapor ----------
    # Çıktı sütunlarının anlamı: docs/11_check_monitoring_tools.md
    - name: İzleme araçları raporu
      vars:
        _vmstat: "{{ ((vmstat_output.stdout | default('')) ~ ('\n' ~ (vmstat_output.stderr | default('')) if (vmstat_output.stderr | default('')) else '')) if vmstat_output is defined else '' }}"
        _iostat: "{{ ((iostat_output.stdout | default('')) ~ ('\n' ~ (iostat_output.stderr | default('')) if (iostat_output.stderr | default('')) else '')) if iostat_output is defined else '' }}"
        _sar: "{{ ((sar_output.stdout | default('')) ~ ('\n' ~ (sar_output.stderr | default('')) if (sar_output.stderr | default('')) else '')) if sar_output is defined else '' }}"
        _dstat: "{{ ((dstat_output.stdout | default('')) ~ ('\n' ~ (dstat_output.stderr | default('')) if (dstat_output.stderr | default('')) else '')) if dstat_output is defined else '' }}"
        _iotop: "{{ ((iotop_output.stdout | default('')) ~ ('\n' ~ (iotop_output.stderr | default('')) if (iotop_output.stderr | default('')) else '')) if iotop_output is defined else '' }}"
        _atop: "{{ ((atop_output.stdout | default('')) ~ ('\n' ~ (atop_output.stderr | default('')) if (atop_output.stderr | default('')) else '')) if atop_output is defined else '' }}"
        _perf: "{{ ((perf_output.stderr | default('')) ~ ('\n' ~ (perf_output.stdout | default('')) if (perf_output.stdout | default('')) else '')) if perf_output is defined else '' }}"
        _glances: "{{ ((glances_output.stdout | default('')) ~ ('\n' ~ (glances_output.stderr | default('')) if (glances_output.stderr | default('')) else '')) if glances_output is defined else '' }}"
      debug:
        msg:
          - |
            ################################################################################
            # HOST: {{ inventory_hostname }}
            # hostname: {{ ansible_facts['hostname'] | default('n/a') }}
            ################################################################################
          - |
            === vmstat (CPU/bellek/swap/I/O genel bakış) ===
            Durum: {{ 'kurulu' if vmstat_ready.rc == 0 else 'kurulamadı' }}
            Yorum: Son satırlara bak — r/b kuyruk; si/so swap baskısı; us+sy yüksek+id düşük=CPU meşgul; wa yüksek=disk bekliyor
            {{ _vmstat | trim }}
          - |
            === iostat (disk cihaz I/O) ===
            Durum: {{ 'kurulu' if iostat_ready.rc == 0 else 'kurulamadı' }}
            Yorum: İkinci örneğe bak — %util ~100 veya yüksek await = disk darboğazı
            {{ _iostat | trim }}
          - |
            === sar (CPU kırılımı) ===
            Durum: {{ 'kurulu' if sar_ready.rc == 0 else 'kurulamadı' }}
            Yorum: %user/%system yüksek=CPU; %iowait yüksek=I/O; %steal yüksek=VM komşu gürültüsü
            {{ _sar | trim }}
          - |
            === htop (interaktif süreç izleyici) ===
            Durum: {{ 'kurulu — SSH içinde elle: htop' if htop_ready.rc == 0 else 'kurulamadı' }}
            Yorum: Otomatik örnek yok (TUI). Anlık kim CPU/RAM yiyor bakmak için.
          - |
            === dstat (cpu+disk+net tek satır) ===
            Durum: {{ 'kurulu' if dstat_ready.rc == 0 else 'kurulamadı (bazı yeni Ubuntu sürümlerinde paket kalkmış olabilir)' }}
            Yorum: Anlık özet; yoksa vmstat+iostat yeterli
            {{ _dstat | trim }}
          - |
            === iotop (process bazlı disk I/O) ===
            Durum: {{ 'kurulu' if iotop_ready.rc == 0 else 'kurulamadı' }}
            Yorum: DISK READ/WRITE yüksek satırlar = disk'i yoran process; boş liste = o anda anlamlı I/O yok
            {{ _iotop | trim }}
          - |
            === atop (sistem paneli özeti) ===
            Durum: {{ 'kurulu' if atop_ready.rc == 0 else 'kurulamadı' }}
            Yorum: CPU/MEM/DSK/NET blokları; çok veth (k8s) NET'i uzatır — hata değil. Process listesi kesildi.
            {{ _atop | trim }}
          - |
            === perf (donanım/yazılım sayaçları) ===
            Durum: {{ 'kurulu' if perf_ready.rc == 0 else 'kurulamadı' }}
            Yorum: cycles/instructions/cache; VM'de '<not supported>' normaldir, hata değildir
            {{ _perf | trim }}
          - |
            === bpftrace (eBPF izleme) ===
            Durum: {{ ('kurulu, sürüm: ' ~ (bpftrace_output.stdout | default('bilinmiyor') | trim)) if bpftrace_ready.rc == 0 else 'kurulamadı' }}
            Yorum: Otomatik betik çalıştırılmaz (riskli). Derin kernel/syscall izleme için SSH'te elle kullanılır.
          - |
            === glances (özet dashboard) ===
            Durum: {{ 'kurulu' if glances_ready.rc == 0 else 'kurulamadı' }}
            Yorum: cpu.total / mem.percent / load.min1 — load'u çekirdek sayısıyla karşılaştır
            {{ _glances | trim }}
          - |
            Detaylı sütun sözlüğü: docs/11_check_monitoring_tools.md
