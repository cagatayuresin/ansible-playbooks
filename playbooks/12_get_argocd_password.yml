---
- name: ArgoCD Admin Şifresi Sorgulama
  hosts: master:singlenode
  gather_facts: false

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: "Kubeconfig / kubectl erişim kontrolü (Çalışma Şartı: ilk control-plane node olmalı)"
      command: kubectl cluster-info
      register: kubectl_check
      ignore_errors: true
      changed_when: false
      check_mode: false
      when: inventory_hostname == first_control_plane

    - name: "ArgoCD namespace var mı kontrolü (Çalışma Şartı: kubectl erişimi olmalı)"
      command: kubectl get namespace argocd
      register: argocd_ns_check
      ignore_errors: true
      changed_when: false
      check_mode: false
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0

    - name: "argocd-initial-admin-secret var mı kontrolü (Çalışma Şartı: argocd namespace bulunmalı)"
      command: kubectl -n argocd get secret argocd-initial-admin-secret
      register: argocd_secret_check
      ignore_errors: true
      changed_when: false
      check_mode: false
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - argocd_ns_check.rc == 0

    - name: "ArgoCD admin şifresini al ve base64 çöz (Çalışma Şartı: argocd-initial-admin-secret bulunmalı)"
      shell: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_password
      changed_when: false
      ignore_errors: true
      check_mode: false
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - argocd_ns_check.rc == 0
        - argocd_secret_check.rc == 0

    - name: "ArgoCD server servis tipi (Çalışma Şartı: argocd namespace bulunmalı)"
      command: kubectl -n argocd get svc argocd-server -o jsonpath="{.spec.type}"
      register: argocd_svc_type
      changed_when: false
      ignore_errors: true
      check_mode: false
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - argocd_ns_check.rc == 0

    - name: "ArgoCD admin şifre raporu (Çalışma Şartı: şifre alınabilmeli)"
      debug:
        msg: >-
          ArgoCD admin şifresi: {{ argocd_password.stdout }} (kullanıcı adı: admin,
          servis tipi: {{ argocd_svc_type.stdout | default('bilinmiyor') }}).
          Bu, ilk kurulumda otomatik oluşturulan tek seferlik şifredir; ArgoCD'nin resmi önerisi
          ilk girişten sonra şifreyi değiştirip
          'kubectl -n argocd delete secret argocd-initial-admin-secret' ile bu secret'ı silmenizdir.
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - argocd_ns_check.rc == 0
        - argocd_secret_check.rc == 0

    - name: "argocd-initial-admin-secret bulunamadı uyarısı (Çalışma Şartı: secret bulunMAmalı)"
      debug:
        msg: >-
          'argocd-initial-admin-secret' bulunamadı. Bu genelde şifrenin daha önce değiştirilip
          ilk secret'ın silindiği anlamına gelir (ArgoCD'nin önerdiği best practice). Mevcut şifreyi
          bu playbook'la öğrenemezsiniz; ya bilinen şifreyle giriş yapmanız ya da admin şifresini
          sıfırlamanız gerekir.
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - argocd_ns_check.rc == 0
        - argocd_secret_check.rc != 0

    - name: "ArgoCD namespace bulunamadı uyarısı (Çalışma Şartı: argocd namespace bulunMAmalı)"
      debug:
        msg: "Bu cluster'da 'argocd' namespace'i bulunamadı, ArgoCD kurulu değil gibi görünüyor."
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - argocd_ns_check.rc != 0

    - name: "kubectl erişimi yok uyarısı (Çalışma Şartı: kubectl erişimi OLMAMALI)"
      debug:
        msg: "kubectl erişimi sağlanamadı, ArgoCD kontrolü yapılamadı."
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc != 0
