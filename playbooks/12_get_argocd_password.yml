---
- name: Query ArgoCD admin password
  hosts: master:singlenode
  gather_facts: false
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: "Check kubeconfig / kubectl access (When: first control-plane node)"
      command: kubectl cluster-info
      register: kubectl_check
      ignore_errors: true
      changed_when: false
      check_mode: false
      when: inventory_hostname == first_control_plane

    - name: "Check whether ArgoCD namespace exists (When: kubectl access is available)"
      command: kubectl get namespace argocd
      register: argocd_ns_check
      ignore_errors: true
      changed_when: false
      check_mode: false
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0

    - name: "Check whether argocd-initial-admin-secret exists (When: argocd namespace exists)"
      command: kubectl -n argocd get secret argocd-initial-admin-secret
      register: argocd_secret_check
      ignore_errors: true
      changed_when: false
      check_mode: false
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - argocd_ns_check.rc == 0

    - name: "Get ArgoCD admin password and base64-decode it (When: argocd-initial-admin-secret exists)"
      shell: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_password
      changed_when: false
      ignore_errors: true
      check_mode: false
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - argocd_ns_check.rc == 0
        - argocd_secret_check.rc == 0

    - name: "Get ArgoCD server service type (When: argocd namespace exists)"
      command: kubectl -n argocd get svc argocd-server -o jsonpath="{.spec.type}"
      register: argocd_svc_type
      changed_when: false
      ignore_errors: true
      check_mode: false
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - argocd_ns_check.rc == 0

    - name: "ArgoCD admin password report (When: password can be retrieved)"
      debug:
        msg: >-
          ArgoCD admin password: {{ argocd_password.stdout }} (username: admin,
          service type: {{ argocd_svc_type.stdout | default('unknown') }}).
          This is the one-time password created at first install; Argo CD's official
          recommendation is to change it after first login and delete the secret with
          'kubectl -n argocd delete secret argocd-initial-admin-secret'.
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - argocd_ns_check.rc == 0
        - argocd_secret_check.rc == 0

    - name: "argocd-initial-admin-secret not found warning (When: secret does NOT exist)"
      debug:
        msg: >-
          'argocd-initial-admin-secret' not found. This usually means the password was already
          changed and the initial secret deleted (Argo CD recommended practice). This playbook
          cannot recover the current password; sign in with a known password or reset the admin
          password.
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - argocd_ns_check.rc == 0
        - argocd_secret_check.rc != 0

    - name: "ArgoCD namespace not found warning (When: argocd namespace does NOT exist)"
      debug:
        msg: "The 'argocd' namespace was not found in this cluster; Argo CD does not appear to be installed."
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc == 0
        - argocd_ns_check.rc != 0

    - name: "No kubectl access warning (When: kubectl access is NOT available)"
      debug:
        msg: "kubectl access failed; Argo CD check was skipped."
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc != 0
