---
- name: Kubernetes warning event report
  hosts: master:singlenode
  gather_facts: true
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"
    # Via --extra-vars: events_since_hours=48 events_limit=120 events_namespace=n8n
    events_since_hours: 24
    events_limit: 80
    # Empty = all namespaces; set = that namespace only
    events_namespace: ""

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Generate warning event report
      script: >-
        k8s_warning_events_check.py
        --since-hours {{ events_since_hours | int }}
        --limit {{ events_limit | int }}
        --namespace {{ events_namespace | default('') | quote }}
      args:
        executable: python3
      register: events_report
      changed_when: false
      ignore_errors: true
      check_mode: false
      when: inventory_hostname == first_control_plane

    - name: Warning event report
      debug:
        msg: >-
          {{
            ['#' * 80,
             '# HOST: ' ~ inventory_hostname,
             '# hostname: ' ~ (ansible_facts['hostname'] | default('n/a')),
             '# since_hours: ' ~ events_since_hours ~ ' | limit: ' ~ events_limit,
             '# namespace: ' ~ (events_namespace if (events_namespace | default('') | length) > 0 else 'ALL'),
             '#' * 80]
            + (events_report.stdout_lines
               | default(events_report.stderr_lines | default(['Report could not be generated'])))
          }}
      when: inventory_hostname == first_control_plane
