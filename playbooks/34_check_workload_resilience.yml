---
- name: Kubernetes Workload Dayanıklılık Kontrolü
  hosts: master:singlenode
  gather_facts: false
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"
    workload_resilience_excluded_namespaces: "kube-system,kube-public,kube-node-lease"
    workload_resilience_max_findings: 300

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Workload dayanıklılık analizini çalıştır
      script: >-
        files/k8s_workload_resilience_check.py
        --exclude-namespaces {{ workload_resilience_excluded_namespaces | quote }}
        --max-findings {{ workload_resilience_max_findings | string | quote }}
      register: workload_resilience_result
      changed_when: false
      failed_when: false
      when: inventory_hostname == first_control_plane

    - name: Workload dayanıklılık raporu
      debug:
        msg: "{{ workload_resilience_result.stdout | default(workload_resilience_result.stderr | default('Rapor üretilemedi')) }}"
      when: inventory_hostname == first_control_plane
