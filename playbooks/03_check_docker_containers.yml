---
- name: Check Docker Container Status
  hosts: all
  gather_facts: false

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Check if Docker is installed
      command: which docker
      register: docker_installed
      ignore_errors: true
      changed_when: false

    - name: "Get Docker containers info as table (Çalışma Şartı: Docker yüklü olmalı)"
      command: docker ps -a --format 'table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}'
      register: docker_ps_table
      when: docker_installed.rc == 0
      changed_when: false

    - name: "Display Docker containers status (Çalışma Şartı: Docker yüklü olmalı ve bilgi alınabilmeli)"
      debug:
        msg: "{{ docker_ps_table.stdout }}"
      when:
        - docker_installed.rc == 0
        - docker_ps_table.stdout is defined

    - name: "Get Docker containers info as JSON (Çalışma Şartı: Docker yüklü olmalı)"
      command: docker ps -a --format '{% raw %}{{json .}}{% endraw %}'
      register: docker_ps_json
      when: docker_installed.rc == 0
      changed_when: false

    - name: Parse container JSON output
      set_fact:
        docker_containers: "{{ docker_ps_json.stdout_lines | map('from_json') | list }}"
      when:
        - docker_installed.rc == 0
        - docker_ps_json.stdout is defined
        - docker_ps_json.stdout != ""

    - name: "Generate browser accessible links for containers (Çalışma Şartı: Docker yüklü olmalı)"
      set_fact:
        docker_links: "{{ (docker_links | default([])) + (item.Ports | regex_findall('0\\.0\\.0\\.0:(\\d+)->') | map('regex_replace', '^(.*)$', '- ' + item.Names + ' -> http://' + inventory_hostname + ':\\1') | list) }}"
      loop: "{{ docker_containers | default([]) }}"
      loop_control:
        label: "{{ item.Names }}"
      when:
        - docker_installed.rc == 0
        - docker_containers is defined

    - name: "Display container links (Çalışma Şartı: Linkler başarıyla üretilebilmeli)"
      debug:
        msg: "Aşağıdaki container portlarına browser üzerinden erişebilirsiniz:\n\n{{ docker_links | default([]) | join('\n') }}"
      when:
        - docker_installed.rc == 0
        - docker_links is defined
        - docker_links | length > 0

    - name: "Docker not found message (Çalışma Şartı: Docker yüklü OLMAMALI)"
      debug:
        msg: "Bu sunucuda Docker kurulu değil veya 'docker' komutu bulunamadı."
      when: docker_installed.rc != 0
