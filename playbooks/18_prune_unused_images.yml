---
- name: Prune unused container images
  hosts: all
  gather_facts: true

  vars:
    # Safety: nothing is deleted unless true — candidate list only
    image_prune_confirm: false
    image_inventory_mode: "{{ 'prune' if (image_prune_confirm | bool) else 'unused' }}"

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

    - name: Prune confirmation warning
      debug:
        msg: >-
          image_prune_confirm=false → unused image CANDIDATES are listed only, not deleted.
          To delete: --extra-vars 'image_prune_confirm=true'
      when: not (image_prune_confirm | bool)
      run_once: true

  tasks:
    - name: List unused image candidates or prune them
      import_tasks: tasks/container_images_inventory.yml
