---
- name: Kubernetes control-plane upgrade (kubeadm upgrade apply/node)
  hosts: master:singlenode
  serial: 1
  gather_facts: false

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

    - name: Validate target Kubernetes version
      import_tasks: tasks/validate_kube_version.yml

  tasks:
    - name: Run node upgrade steps
      import_tasks: tasks/k8s_upgrade_node.yml

- name: Kubernetes worker node upgrade (kubeadm upgrade node)
  hosts: workers
  serial: 1
  gather_facts: false

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

    - name: Validate target Kubernetes version
      import_tasks: tasks/validate_kube_version.yml

  tasks:
    - name: Run node upgrade steps
      import_tasks: tasks/k8s_upgrade_node.yml
