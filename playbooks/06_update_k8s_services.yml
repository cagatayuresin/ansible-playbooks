---
- name: Kubernetes Control-Plane Güncellemesi (kubeadm upgrade apply/node)
  hosts: master:singlenode
  serial: 1
  gather_facts: false

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

    - name: Hedef Kubernetes sürümü belirtilmiş mi kontrol et
      ansible.builtin.fail:
        msg: >-
          kube_version değişkeni belirtilmedi. Örnek: --extra-vars "kube_version=1.34.3".
          kubeadm resmi kısıtı gereği tek seferde yalnızca BİR minor sürüm ileri gidilebilir
          (ör. 1.33.x -> 1.34.x); birden fazla minor atlamak desteklenmez ve cluster'ı bozabilir.
      run_once: true
      when: kube_version is not defined or kube_version == ""

  tasks:
    - name: Node güncelleme adımlarını çalıştır
      import_tasks: tasks/k8s_upgrade_node.yml

- name: Kubernetes Worker Node Güncellemesi (kubeadm upgrade node)
  hosts: workers
  serial: 1
  gather_facts: false

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Node güncelleme adımlarını çalıştır
      import_tasks: tasks/k8s_upgrade_node.yml
