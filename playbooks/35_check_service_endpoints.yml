---
- name: Kubernetes Service ve EndpointSlice Sağlık Kontrolü
  hosts: "{{ ((groups.get('master', []) + groups.get('singlenode', [])) | join(',')) | default('all', true) }}"
  gather_facts: false
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  vars:
    first_control_plane: >-
      {{
        (groups.get('master', []) + groups.get('singlenode', []))
        | first
        | default('')
      }}
    service_endpoints_excluded_namespaces: "kube-system,kube-public,kube-node-lease"
    service_endpoints_max_findings: 300

  pre_tasks:
    - name: Ping pong bağlantı testi
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Service ve EndpointSlice analizini çalıştır
      script: >-
        files/k8s_service_endpoints_check.py
        --exclude-namespaces {{ service_endpoints_excluded_namespaces | quote }}
        --max-findings {{ service_endpoints_max_findings | string | quote }}
      register: service_endpoints_result
      changed_when: false
      failed_when: service_endpoints_result.rc != 0
      when: inventory_hostname == first_control_plane

    - name: Service ve EndpointSlice sağlık raporu
      debug:
        msg: "{{ service_endpoints_result.stdout | default(service_endpoints_result.stderr | default('Rapor üretilemedi')) }}"
      when: inventory_hostname == first_control_plane
