---
- name: Metrics-server install and stats
  hosts: master:singlenode
  gather_facts: true
  environment:
    KUBECONFIG: "{{ '/root/.kube/config' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.kube/config' }}"

  vars:
    first_control_plane: "{{ (groups['master'] | default([]) + groups['singlenode'] | default([])) | first }}"
    # Release is pinned for repeatable installs; override with --extra-vars.
    metrics_server_version: "v0.8.1"
    metrics_server_manifest_url: >-
      https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml
    # Usually required for on-prem / self-signed kubelet certificates
    metrics_server_kubelet_insecure_tls: true

  pre_tasks:
    - name: Ping connectivity test
      import_tasks: tasks/ping_pong.yml

  tasks:
    - name: Check metrics-server status
      import_tasks: tasks/metrics_server_check.yml
      when: inventory_hostname == first_control_plane

    - name: Ensure metrics-server is installed
      import_tasks: tasks/metrics_server_install.yml
      when:
        - inventory_hostname == first_control_plane
        - kubectl_check.rc | default(1) == 0

    - name: Recheck metrics-server status after install
      import_tasks: tasks/metrics_server_check.yml
      when: inventory_hostname == first_control_plane

    - name: Collect metrics-server stats
      import_tasks: tasks/metrics_server_report.yml
      when: inventory_hostname == first_control_plane
