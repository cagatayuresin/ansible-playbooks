---
- name: Test Kubernetes version policy
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    current_kube_version: "v1.33.7"
    kubeadm_version:
      rc: 0
      stdout: "{{ current_kube_version }}"

  tasks:
    - name: Validate target version format
      import_tasks: ../playbooks/tasks/validate_kube_version.yml

    - name: Validate upgrade range
      import_tasks: ../playbooks/tasks/validate_kube_upgrade_range.yml
