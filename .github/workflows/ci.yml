name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ansible and lint tools
        run: python -m pip install -r requirements-ci.txt

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint playbooks/

      - name: Validate example inventory
        run: ansible-inventory -i inventories-example/musteri_a/hosts.ini --list > /dev/null

      - name: Validate helper scripts
        run: |
          python -m compileall -q playbooks/files
          bash -n playbooks/files/k8s_etcd_backup.sh
          for f in playbooks/files/shell-aliases/*.sh; do
            echo "== bash -n $f =="
            bash -n "$f"
          done

      - name: Test helper logic
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate playbook documentation mapping
        run: |
          set -e
          for f in playbooks/[0-9][0-9]_*.yml; do
            base="$(basename "$f" .yml)"
            doc="docs/${base}.md"
            doc_tr="docs/tr/${base}.md"
            test -f "$doc" || { echo "Missing documentation: $doc"; exit 1; }
            test -f "$doc_tr" || { echo "Missing Turkish documentation: $doc_tr"; exit 1; }
          done

      - name: Validate Kubernetes version policy
        run: |
          set -e
          for target in 1.33.7 1.33.8 1.34.0; do
            ansible-playbook -i localhost, tests/test_kube_version_policy.yml \
              --extra-vars "kube_version=$target" > /dev/null
          done
          for target in 1.33.6 1.32.9 1.35.0 2.0.0 1.34; do
            if ansible-playbook -i localhost, tests/test_kube_version_policy.yml \
              --extra-vars "kube_version=$target" > /dev/null 2>&1; then
              echo "Unsupported target unexpectedly accepted: $target"
              exit 1
            fi
          done

      - name: Syntax-check all playbooks
        run: |
          set -e
          for f in playbooks/*.yml; do
            echo "== $f =="
            ansible-playbook -i inventories-example/musteri_a/hosts.ini --syntax-check "$f"
          done
